[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-parse-workflow-engine"
version = "0.1.0"
description = "Lightweight workflow engine for multimodal content parsing."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "click>=8.1",
  "openai>=1.35",
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "beautifulsoup4>=4.12",
  "pdfplumber>=0.11",
  "pypdf>=6.14.2",
  "python-docx>=1.1",
  "pandas>=2.2",
  "xlrd>=2.0",
  "openpyxl>=3.1",
  "Pillow>=12.3.0",
  "rapidocr-onnxruntime>=1.4",
  "soundfile>=0.13",
  "regex>=2026.5.9",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[project.scripts]
parse = "parse_engine.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["parse_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
