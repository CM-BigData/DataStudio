---
workflow:
  id: image_aigc_eval_v1
  name: 图像 AIGC 检查最小工作流
  mode: pipeline
  task_type: image
  batch_size: 16
  concurrency: 1
  checkpoint: true
runtime:
  executor: thread
  workers: 1
  batch_size: 16
  retry_times: 0
input:
  type: image_folder
  path: "./example_data/image_aigc_eval_sample"
  annotation_path: "./example_data/image_aigc_eval_sample/annotations.json"
output:
  result_path: "./real_outputs/image_aigc_eval_result.jsonl"
  summary_path: "./real_outputs/image_aigc_eval_summary.json"
  report_path: "./real_reports/image_aigc_eval_report.md"
rules:
  allowed_formats:
  - jpg
  - jpeg
  - png
  aigc_detector_backend: fallback
  aigc_model_name: haywoodsloan/ai-image-detector-deploy
  aigc_threshold: 0.28
score_weights:
  规范性: 0.15
  完整性: 0.15
  准确性: 0.2
  一致性: 0.15
  安全性: 0.15
  干净性: 0.1
  多样性: 0.05
  模型适配性: 0.05
steps:
- id: image_dataset_eval
  operator: image_dataset_eval
  params:
    enabled_checks:
    - aigc
