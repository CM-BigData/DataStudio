workflow:
  id: real_text_dedup_strict_v1
  name: Real text deduplication workflow
  modality: text
  mode: pipeline
  checkpoint: true
input:
  type: jsonl
  path: ./data/real_text_dedup/input.jsonl
output:
  run_dir: ./runs/real_text_strict
  kept_path: kept.jsonl
  removed_path: removed.jsonl
  review_path: review.jsonl
  duplicate_groups_path: duplicate_groups.jsonl
  metrics_path: metrics.json
  operator_log_path: operator_logs.jsonl
  report_path: report.md
steps:
- id: text_dedup
  operator: text_dedup
  params:
    profile: strict
    methods:
      exact_hash: true
      simhash:
        bit_size: 64
        ngram: 2
        max_hamming_distance: 10
      minhash:
        shingle_size: 5
        min_length: 35
        jaccard_threshold: 0.55
      embedding: false
      rerank: false
    thresholds:
      cluster_min_score: 0.55
    model_ref:
      embedding: TEXT_EMBEDDING_*
      rerank: TEXT_RERANK_*
