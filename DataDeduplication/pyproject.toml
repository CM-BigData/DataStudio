[project]
name = "dedup-workflow-engine"
version = "0.1.0"
description = "Lightweight workflow engine for text, image, and audio deduplication."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0.0", "Pillow>=12.3.0"]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["pytest>=8.0.0"]

[project.scripts]
dedup = "dedup_workflow_engine.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dedup_workflow_engine*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
