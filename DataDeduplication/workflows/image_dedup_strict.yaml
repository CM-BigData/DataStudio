workflow:
  id: image_dedup_strict_v1
  name: Strict image deduplication workflow
  modality: image
  mode: pipeline
  checkpoint: true
input:
  type: jsonl
  path: ./example_data/image/input.jsonl
output:
  run_dir: ./runs/image_strict
  kept_path: kept.jsonl
  removed_path: removed.jsonl
  review_path: review.jsonl
  duplicate_groups_path: duplicate_groups.jsonl
  metrics_path: metrics.json
  operator_log_path: operator_logs.jsonl
  report_path: report.md
steps:
- id: image_dedup
  operator: image_dedup
  params:
    profile: strict
    methods:
      file_hash: true
      phash:
        hash_size: 8
        max_hamming_distance: 4
      ssim:
        threshold: 0.9
        max_side: 64
      embedding: false
      region_similarity: false
    thresholds:
      cluster_min_score: 0.85
    model_ref:
      embedding: IMAGE_EMBEDDING_*
