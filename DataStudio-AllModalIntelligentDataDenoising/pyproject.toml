[project]
name = "denoise-workflow-engine"
version = "0.1.0"
description = "Lightweight workflow engine for multimodal data denoising."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26.0",
  "opencv-python>=4.8.0",
  "Pillow>=12.3.0",
  "qrcode>=7.4.0",
  "requests>=2.31.0",
  "PyYAML>=6.0.0",
  "id-validator>=1.0.20",
  "phonenumbers>=8.13.0",
  "email-validator>=2.0.0",
  "python-stdnum>=1.19",
  "validators>=0.22.0",
  "lingua-language-detector>=2.0.0",
  "scikit-image>=0.22.0",
  "ImageHash>=4.3.1",
  "rapidfuzz>=3.6.0",
  "regex>=2026.5.9",
]

[project.optional-dependencies]
image = ["Pillow>=12.3.0"]
yaml = ["PyYAML>=6.0.0"]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["denoise_workflow_engine*"]

[project.scripts]
denoise = "denoise_workflow_engine.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["clean_version"]
