---
workflow:
  id: text_consecutive_punctuation_eval_v1
  name: Text Consecutive Punctuation Evaluation
  mode: pipeline
  task_type: text
  batch_size: 64
  concurrency: 1
  checkpoint: true
runtime:
  executor: thread
  workers: 1
  batch_size: 64
  retry_times: 0
input:
  type: jsonl
  path: "./example_data/text_consecutive_punctuation_sample/samples.jsonl"
output:
  result_path: "./real_outputs/text_consecutive_punctuation_eval_result.jsonl"
  summary_path: "./real_outputs/text_consecutive_punctuation_eval_summary.json"
  report_path: "./real_reports/text_consecutive_punctuation_eval_report.md"
rules:
  min_text_length: 5
  max_text_length: 200
  abnormal_char_ratio: 0.3
  duplicate_check: false
  max_consecutive_punctuation_repeat: 2
  max_question_exclamation_repeat: 2
  max_period_repeat: 2
  max_ellipsis_repeat: 6
  allowed_mixed_punctuation_sequences:
  - "?!"
  - "!?"
  - "！？"
  - "？！"
  - "!？"
  - "！?"
  - "……"
score_weights:
  规范性: 0.15
  完整性: 0.15
  准确性: 0.2
  一致性: 0.15
  安全性: 0.15
  干净性: 0.1
  多样性: 0.05
  模型适配性: 0.05
steps:
- id: text_dataset_eval
  operator: text_dataset_eval
  params:
    enabled_checks:
    - consecutive_punctuation
