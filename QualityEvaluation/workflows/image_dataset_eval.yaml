---
workflow:
  id: image_dataset_eval_v1
  name: 图像数据集质量评测
  mode: pipeline
  task_type: image
  batch_size: 64
  concurrency: 1
  checkpoint: true
runtime:
  executor: thread
  workers: 1
  batch_size: 64
  retry_times: 0
input:
  type: image_folder
  path: "./example_data/image_dataset"
  annotation_path: "./example_data/image_dataset/annotations.json"
output:
  result_path: "./outputs/image_eval_result.jsonl"
  summary_path: "./outputs/image_eval_summary.json"
  report_path: "./outputs/image_eval_report.md"
rules:
  allowed_formats:
  - jpg
  - jpeg
  - png
  min_width: 224
  min_height: 224
  min_aspect_ratio: 0.3
  max_aspect_ratio: 3.0
  blur_threshold: 5
  duplicate_check: true
score_weights:
  规范性: 0.15
  完整性: 0.15
  准确性: 0.2
  一致性: 0.15
  安全性: 0.15
  干净性: 0.1
  多样性: 0.05
  模型适配性: 0.05
steps:
- id: image_dataset_eval
  operator: image_dataset_eval
  params: {}
