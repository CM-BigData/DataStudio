---
workflow:
  id: text_special_characters_eval_v1
  name: Text Special Characters Evaluation
  mode: pipeline
  task_type: text
  batch_size: 64
  concurrency: 1
  checkpoint: true
runtime:
  executor: thread
  workers: 1
  batch_size: 64
  retry_times: 0
input:
  type: jsonl
  path: "./example_data/text_special_characters_sample/samples.jsonl"
output:
  result_path: "./real_outputs/text_special_characters_eval_result.jsonl"
  summary_path: "./real_outputs/text_special_characters_eval_summary.json"
  report_path: "./real_reports/text_special_characters_eval_report.md"
rules:
  min_text_length: 5
  max_text_length: 200
  abnormal_char_ratio: 0.3
  duplicate_check: false
  allowed_control_characters:
  - "\n"
  - "\r"
  - "\t"
  invisible_characters:
  - "​"
  - "‌"
  - "‍"
  - "\uFEFF"
  - "⁠"
  - "­"
  mojibake_fragments:
  - ï»¿
  - â€™
  - â€œ
  - "â€\x9D"
  - â€¦
  - Â
  - Ã
  - "¤"
  - "�"
score_weights:
  规范性: 0.15
  完整性: 0.15
  准确性: 0.2
  一致性: 0.15
  安全性: 0.15
  干净性: 0.1
  多样性: 0.05
  模型适配性: 0.05
steps:
- id: text_dataset_eval
  operator: text_dataset_eval
  params:
    enabled_checks:
    - special_characters
