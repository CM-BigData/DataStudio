{
  "workflow": {
    "id": "denoise_local_real_smoke",
    "name": "denoise_local_real_smoke",
    "mode": "pipeline",
    "batch_size": 16,
    "concurrency": 1,
    "checkpoint": false
  },
  "input": {
    "type": "jsonl",
    "path": "../example_data/input.jsonl"
  },
  "output": {
    "run_dir": "../outputs/local_real_smoke",
    "clean_path": "clean.jsonl",
    "dropped_path": "dropped.jsonl",
    "review_path": "review.jsonl",
    "report_path": "report.md"
  },
  "steps": [
    {
      "id": "auto_denoise",
      "operator": "auto_denoise",
      "params": {
        "profile": "default",
        "thresholds": {
          "min_confidence": 0.25,
          "remove_cjk_inner_spaces": true,
          "allowed_languages": [
            "zh",
            "mixed"
          ],
          "min_length": 12,
          "max_length": 2000,
          "max_repetition_ratio": 0.35,
          "min_info_density": 0.28,
          "min_unique_char_ratio": 0.06,
          "stage": "post",
          "add_quality_issues": true,
          "mark_repairable": false,
          "min_semantic_score": 0.55,
          "review_semantic_score": 0.72,
          "min_width": 160,
          "min_height": 120,
          "min_aspect_ratio": 0.2,
          "max_aspect_ratio": 5.0,
          "min_sharpness": 3.0,
          "max_brightness": 245,
          "min_brightness": 25,
          "max_noise_sigma": 24.0,
          "min_watermark_score": 0.72,
          "min_logo_score": 0.3,
          "min_center_score": 0.05,
          "review_center_score": 0.08,
          "max_crop_risk": 0.62,
          "min_vlm_score": 0.55,
          "review_vlm_score": 0.72,
          "min_ocr_consistency": 0.08,
          "min_keyword_similarity": 0.15,
          "min_clip_similarity": 0.28,
          "min_vlm_consistency": 0.28,
          "min_bytes": 1024,
          "min_duration": 1.0,
          "min_fps": 10.0,
          "timeout": 90,
          "sample_fps": 1.0,
          "max_frames": 4,
          "black_brightness": 12.0,
          "max_black_frame_ratio": 0.5,
          "min_video_sharpness": 3.0,
          "max_bad_frame_ratio": 0.5,
          "max_frame_noise": 24.0,
          "freeze_diff_threshold": 1.5,
          "max_freeze_frame_ratio": 0.75,
          "max_scan_frames": 4,
          "silent_max_volume_db": -50.0,
          "low_mean_volume_db": -38.0,
          "max_ocr_frames": 2,
          "max_vlm_frames": 2,
          "max_warning_red_ratio": 0.12,
          "min_consistency": 0.25,
          "output_dir": "../outputs/local_real_smoke/repaired_videos",
          "audio_volume_factor": 3.0,
          "keep_score": 0.75,
          "review_score": 0.55,
          "hard_fail_issues": [
            "data_leakage_suspected",
            "unknown_modality",
            "empty_text",
            "image_missing",
            "decode_failed",
            "invalid_json",
            "unsupported_language",
            "language_mismatch",
            "too_short",
            "text_too_short",
            "repetition_high",
            "low_info_density",
            "text_sensitive_masked",
            "sensitive_content",
            "semantic_low_quality",
            "low_resolution",
            "pure_color",
            "qrcode_detected",
            "watermark_detected",
            "logo_detected",
            "image_safety_risk",
            "safety_risk",
            "pair_missing_image",
            "pair_missing_text",
            "clip_mismatch",
            "vlm_contradiction",
            "ocr_key_field_conflict",
            "pair_safety_risk",
            "video_missing",
            "no_video_stream",
            "ffprobe_failed",
            "black_frames",
            "freeze_frames",
            "video_qrcode_detected",
            "video_safety_risk",
            "sensitive_speech_text",
            "audio_visual_inconsistent",
            "speech_subtitle_inconsistent",
            "video_too_short",
            "low_video_resolution"
          ]
        },
        "model_ref": {
          "llm": {
            "api_key_env": "LLM_API_KEY",
            "api_base_env": "LLM_API_BASE",
            "model_env": "LLM_MODEL",
            "path_env": "LLM_CHAT_COMPLETIONS_PATH",
            "timeout": 60,
            "temperature": 0,
            "max_tokens": 800
          },
          "vlm": {
            "api_key_env": "VLM_API_KEY",
            "api_base_env": "VLM_API_BASE",
            "model_env": "VLM_MODEL",
            "path_env": "VLM_CHAT_COMPLETIONS_PATH",
            "timeout": 60,
            "temperature": 0,
            "max_tokens": 800
          },
          "ocr": {
            "api_key_env": "OCR_API_KEY",
            "api_base_env": "OCR_API_BASE",
            "model_env": "OCR_MODEL",
            "path_env": "OCR_CHAT_COMPLETIONS_PATH",
            "timeout": 60,
            "temperature": 0,
            "max_tokens": 800
          },
          "clip": {
            "api_key_env": "CLIP_API_KEY",
            "api_base_env": "CLIP_API_BASE",
            "model_env": "CLIP_MODEL",
            "path_env": "CLIP_CHAT_COMPLETIONS_PATH",
            "timeout": 60,
            "temperature": 0,
            "max_tokens": 800
          },
          "asr": {
            "api_key_env": "ASR_API_KEY",
            "api_base_env": "ASR_API_BASE",
            "model_env": "ASR_MODEL",
            "path_env": "ASR_TRANSCRIPTIONS_PATH",
            "timeout": 60,
            "temperature": 0,
            "max_tokens": 800
          }
        }
      }
    }
  ]
}
